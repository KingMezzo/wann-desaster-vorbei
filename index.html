<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lesson Minute Counter</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                    },
                    colors: {
                        dark: '#0f1115',
                        surface: '#1c1f26',
                        accent: '#10b981', // Emerald
                        accentHover: '#059669',
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-dark text-white h-screen overflow-hidden flex items-center justify-center relative font-sans antialiased selection:bg-accent selection:text-white">
    <!-- Ambient Background Glow -->
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[800px] h-[800px] bg-accent/5 rounded-full blur-[120px] pointer-events-none transition-colors duration-1000" id="ambientGlow"></div>

    <!-- Main Dashboard -->
    <main class="relative z-10 w-full max-w-lg p-8 sm:p-12 mx-4 rounded-3xl glass-panel shadow-2xl flex flex-col items-center text-center transition-all duration-500">
        <!-- Settings Toggle -->
        <button id="openSettingsBtn" class="absolute top-6 right-6 p-2 rounded-full hover:bg-white/10 transition-colors text-white/50 hover:text-white group" aria-label="Einstellungen">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="group-hover:rotate-90 transition-transform duration-500"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path><circle cx="12" cy="12" r="3"></circle></svg>
        </button>

        <div class="mb-4 text-white/40 font-medium tracking-widest uppercase text-sm" id="currentTimeDisplay">--:--:--</div>
        
        <h2 id="currentEventName" class="text-3xl sm:text-4xl font-semibold mb-2 text-white/90">Laden...</h2>
        <p id="nextEventHint" class="text-white/50 text-sm mb-8 h-5">Einen Moment bitte</p>

        <div class="relative flex items-center justify-center mb-8">
            <svg class="w-64 h-64 sm:w-80 sm:h-80 -rotate-90 drop-shadow-xl" viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="45" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="3"></circle>
                <circle id="progressCircle" cx="50" cy="50" r="45" fill="none" stroke="currentColor" stroke-width="3.5" stroke-dasharray="283" stroke-dashoffset="283" class="text-accent transition-all duration-1000 ease-out drop-shadow-[0_0_8px_currentColor]"></circle>
            </svg>
            <div class="absolute flex flex-col items-center">
                <span id="countdownDisplay" class="text-5xl sm:text-7xl font-extrabold tracking-tighter text-shadow-glow text-accent transition-colors duration-1000">--:--</span>
                <span class="text-white/50 mt-2 uppercase tracking-widest text-xs font-semibold" id="countdownLabel">Verbleibend</span>
            </div>
        </div>
        
        <div class="w-full flex justify-between text-xs text-white/40 font-medium px-4">
            <span id="startTimeDisplay">--:--</span>
            <span id="endTimeDisplay">--:--</span>
        </div>
    </main>

    <!-- Settings Modal -->
    <div id="settingsModal" class="fixed inset-0 z-50 flex items-center justify-center opacity-0 pointer-events-none transition-opacity duration-300 backdrop-blur-md bg-black/60 p-4">
        <div class="bg-surface border border-white/10 p-6 sm:p-8 rounded-3xl w-full max-w-2xl max-h-[90vh] flex flex-col shadow-2xl scale-95 transition-transform duration-300" id="settingsContent">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-2xl font-semibold">Stundenplan konfigurieren</h3>
                <button id="closeSettingsBtn" class="p-2 rounded-full hover:bg-white/10 transition-colors text-white/50 hover:text-white">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>
            
            <!-- Headers for schedule list -->
            <div class="grid grid-cols-12 gap-2 text-xs uppercase tracking-widest text-white/40 mb-2 px-2">
                <div class="col-span-4">Name</div>
                <div class="col-span-3">Typ</div>
                <div class="col-span-2 text-center">Start</div>
                <div class="col-span-2 text-center">Ende</div>
                <div class="col-span-1 text-center"></div>
            </div>

            <div class="flex-1 overflow-y-auto pr-2 custom-scrollbar space-y-3" id="scheduleList">
                <!-- Schedule items will be injected here -->
            </div>

            <div class="mt-6 flex gap-3 border-t border-white/10 pt-6">
                <button id="addEventBtn" class="flex-1 py-3 px-4 rounded-xl bg-white/5 hover:bg-white/10 transition-colors font-medium border border-white/10 text-white/80 hover:text-white flex items-center justify-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                    Neuer Block
                </button>
                <button id="saveSettingsBtn" class="flex-1 py-3 px-4 rounded-xl bg-accent hover:bg-accentHover transition-colors text-white font-semibold shadow-[0_0_20px_rgba(16,185,129,0.3)]">
                    Speichern
                </button>
            </div>
        </div>
    </div>

    <!-- Template for schedule row -->
    <template id="scheduleRowTemplate">
        <div class="schedule-item grid grid-cols-12 gap-2 items-center bg-white/5 p-2 sm:p-3 rounded-xl border border-white/5 hover:border-white/10 transition-colors group">
            <div class="col-span-4 relative flex items-center">
                <div class="w-2 h-2 rounded-full bg-accent mr-2 sm:mr-3 flex-shrink-0 type-indicator"></div>
                <input type="text" class="event-name-input text-xs sm:text-sm" placeholder="Name..." value="">
            </div>
            <div class="col-span-3">
                <select class="type-select w-full bg-black/30 border border-white/5 rounded-lg text-white text-xs sm:text-sm p-1.5 outline-none focus:border-accent">
                    <option value="lesson" class="bg-surface">Unterricht</option>
                    <option value="break" class="bg-surface">Pause</option>
                </select>
            </div>
            <div class="col-span-2">
                <input type="time" class="time-input w-full text-center text-xs sm:text-sm !p-1 sm:!p-1.5" value="" required>
            </div>
            <div class="col-span-2">
                <input type="time" class="time-input w-full text-center text-xs sm:text-sm !p-1 sm:!p-1.5" value="" required>
            </div>
            <div class="col-span-1 flex justify-end">
                <button class="delete-btn p-1.5 sm:p-2 rounded-lg text-red-400/50 hover:text-red-400 hover:bg-red-400/10 transition-colors" title="Entfernen">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"></path><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path></svg>
                </button>
            </div>
        </div>
    </template>

    <!-- Action Menu (Bottom Right) -->
    <div class="fixed bottom-6 right-6 flex flex-col gap-3 z-40">
        <!-- Load MTS -->
        <button id="loadMtsBtn" class="p-3 rounded-full bg-surface border border-white/10 hover:border-accent hover:text-accent shadow-lg transition-all group relative text-white/50" title="MTS-Zeiten laden">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
            <span class="absolute right-full mr-3 top-1/2 -translate-y-1/2 px-2 py-1 bg-surface text-xs rounded opacity-0 pointer-events-none group-hover:opacity-100 transition-opacity whitespace-nowrap border border-white/10 text-white shadow-lg">MTS-Zeiten laden</span>
        </button>
        <!-- Import -->
        <button id="importBtn" class="p-3 rounded-full bg-surface border border-white/10 hover:border-white hover:text-white shadow-lg transition-all group relative text-white/50" title="Importieren">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
            <span class="absolute right-full mr-3 top-1/2 -translate-y-1/2 px-2 py-1 bg-surface text-xs rounded opacity-0 pointer-events-none group-hover:opacity-100 transition-opacity whitespace-nowrap border border-white/10 text-white shadow-lg">Importieren</span>
        </button>
        <!-- Export -->
        <button id="exportBtn" class="p-3 rounded-full bg-surface border border-white/10 hover:border-white hover:text-white shadow-lg transition-all group relative text-white/50" title="Exportieren">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
            <span class="absolute right-full mr-3 top-1/2 -translate-y-1/2 px-2 py-1 bg-surface text-xs rounded opacity-0 pointer-events-none group-hover:opacity-100 transition-opacity whitespace-nowrap border border-white/10 text-white shadow-lg">Exportieren</span>
        </button>
        <input type="file" id="importInput" accept=".json" class="hidden">
    </div>

    <script src="app.js"></script>
</body>
</html>
